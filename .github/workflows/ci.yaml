# Continuous integration for ArchGrader.
#
# 1. R CMD check, which also runs the whole testthat suite.
# 2. The regression gate: data-raw/make_summary.R grades all 30 mock submissions
#    and exits non-zero if any score differs from the hand-derived answer key
#    (inst/mock_submissions/expected_scores.csv), if an error is reported at the
#    wrong chunk, or if test coverage falls below 80%.
#
# The summary it writes (results/summary.md) is shown on the run's page and kept
# as a downloadable artifact.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::covr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'

      - name: Grade the mock submissions and compare with the answer key
        run: Rscript data-raw/make_summary.R

      - name: Show the summary on the run page
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
