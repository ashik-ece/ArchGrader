# Placeholder CI: installs R and Quarto and runs the testthat suite.
# Phase 5 extends this to grade the sample submissions and fail the build if
# the scores differ from inst/mock_submissions/expected_scores.csv.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat
          needs: check

      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
